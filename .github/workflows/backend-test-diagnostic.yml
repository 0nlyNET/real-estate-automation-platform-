name: Backend test diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend-test-diagnostic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Capture Jest output
        id: tests
        shell: bash
        run: |
          set +e
          npm test -- --runInBand > backend-test-output.txt 2>&1
          code=$?
          echo "$code" > backend-test-exit-code.txt
          exit 0
      - name: Upload diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-diagnostic
          path: |
            backend/backend-test-output.txt
            backend/backend-test-exit-code.txt
          if-no-files-found: error
      - name: Preserve test result
        shell: bash
        run: |
          code=$(cat backend-test-exit-code.txt)
          test "$code" = "0"
