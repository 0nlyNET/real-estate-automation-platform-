name: Export admin integrations source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-integrations-tab
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: admin-integrations-source
          path: |
            frontend/app/admin/dashboard/page.tsx
            frontend/app/admin/integrations/page.tsx
            frontend/app/admin/layout.tsx
            frontend/scripts/verify-client-readiness.mjs
            frontend/scripts/verify-admin-routing.mjs
          if-no-files-found: error
