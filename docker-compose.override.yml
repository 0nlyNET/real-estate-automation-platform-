services:
  backend:
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: real_estate
      DB_SSL: "false"
      PGSSLMODE: disable
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/real_estate?sslmode=disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
