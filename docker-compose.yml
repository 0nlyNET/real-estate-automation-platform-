services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${LOCAL_DB_USER:-realtytechai}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in a root .env file}
      POSTGRES_DB: ${LOCAL_DB_NAME:-real_estate}
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USER:-realtytechai} -d ${LOCAL_DB_NAME:-real_estate}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${LOCAL_DB_USER:-realtytechai}
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in a root .env file}
      DB_NAME: ${LOCAL_DB_NAME:-real_estate}
      TYPEORM_SYNC: ${TYPEORM_SYNC:-false}
      RUN_MIGRATIONS: "true"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a root .env file}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      PLATFORM_STAFF_EMAILS: ${PLATFORM_STAFF_EMAILS:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_TENANT_NAME: ${SEED_TENANT_NAME:-RealtyTechAI Workspace}
      INTEGRATIONS_ENCRYPTION_KEY: ${INTEGRATIONS_ENCRYPTION_KEY:-}
      UNSUBSCRIBE_TOKEN_SECRET: ${UNSUBSCRIBE_TOKEN_SECRET:-}
      FRONTEND_URL: http://localhost:3000
      PUBLIC_APP_URL: http://localhost:3000
      PUBLIC_API_URL: http://localhost:4000
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_WEBHOOK_URL: ${GOOGLE_CALENDAR_WEBHOOK_URL:-}
      MICROSOFT_CALENDAR_CLIENT_ID: ${MICROSOFT_CALENDAR_CLIENT_ID:-}
      MICROSOFT_CALENDAR_CLIENT_SECRET: ${MICROSOFT_CALENDAR_CLIENT_SECRET:-}
      MICROSOFT_CALENDAR_WEBHOOK_URL: ${MICROSOFT_CALENDAR_WEBHOOK_URL:-}
      CALENDLY_CLIENT_ID: ${CALENDLY_CLIENT_ID:-}
      CALENDLY_CLIENT_SECRET: ${CALENDLY_CLIENT_SECRET:-}
      CALENDLY_WEBHOOK_SIGNING_KEY: ${CALENDLY_WEBHOOK_SIGNING_KEY:-}
      CALENDLY_WEBHOOK_URL: ${CALENDLY_WEBHOOK_URL:-}
      GLOBAL_AUTOMATIONS_DISABLED: ${GLOBAL_AUTOMATIONS_DISABLED:-false}
      BILLING_GRACE_DAYS: ${BILLING_GRACE_DAYS:-0}
      HEALTH_CHECK_TOKEN: ${HEALTH_CHECK_TOKEN:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-RealtyTechAI}
      SALES_INBOX_EMAIL: ${SALES_INBOX_EMAIL:-}
      SENDGRID_INBOUND_WEBHOOK_URL: ${SENDGRID_INBOUND_WEBHOOK_URL:-}
      SENDGRID_INBOUND_USERNAME: ${SENDGRID_INBOUND_USERNAME:-}
      SENDGRID_INBOUND_PASSWORD: ${SENDGRID_INBOUND_PASSWORD:-}
      SENDGRID_SENDING_DOMAIN: ${SENDGRID_SENDING_DOMAIN:-}
      SENDGRID_REPLY_DOMAIN: ${SENDGRID_REPLY_DOMAIN:-}
      SENDGRID_EVENT_WEBHOOK_URL: ${SENDGRID_EVENT_WEBHOOK_URL:-}
      SENDGRID_SPF_VERIFIED_AT: ${SENDGRID_SPF_VERIFIED_AT:-}
      SENDGRID_DKIM_VERIFIED_AT: ${SENDGRID_DKIM_VERIFIED_AT:-}
      SENDGRID_DMARC_VERIFIED_AT: ${SENDGRID_DMARC_VERIFIED_AT:-}
      TWILIO_WEBHOOK_URL: ${TWILIO_WEBHOOK_URL:-}
      TWILIO_STATUS_CALLBACK_URL: ${TWILIO_STATUS_CALLBACK_URL:-}
      TWILIO_DEFAULT_COUNTRY: ${TWILIO_DEFAULT_COUNTRY:-US}
      TWILIO_DEFAULT_AREA_CODE: ${TWILIO_DEFAULT_AREA_CODE:-}
      TWILIO_PRIMARY_CUSTOMER_PROFILE_SID: ${TWILIO_PRIMARY_CUSTOMER_PROFILE_SID:-}
      TWILIO_SECONDARY_PROFILE_POLICY_SID: ${TWILIO_SECONDARY_PROFILE_POLICY_SID:-}
      TWILIO_A2P_TRUST_PRODUCT_POLICY_SID: ${TWILIO_A2P_TRUST_PRODUCT_POLICY_SID:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_SERVICE_MONTH: ${STRIPE_PRICE_SERVICE_MONTH:-}
      STRIPE_PRICE_SETUP_ONCE: ${STRIPE_PRICE_SETUP_ONCE:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      OPERATIONAL_RETENTION_DAYS: ${OPERATIONAL_RETENTION_DAYS:-90}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
      OPENAI_ASSISTANT_MODEL: ${OPENAI_ASSISTANT_MODEL:-}
      AI_MODEL_TIMEOUT_MS: ${AI_MODEL_TIMEOUT_MS:-15000}
      AI_MODEL_MAX_RETRIES: ${AI_MODEL_MAX_RETRIES:-1}
      AI_MAX_CONTEXT_CHARACTERS: ${AI_MAX_CONTEXT_CHARACTERS:-12000}
      AI_CIRCUIT_BREAKER_FAILURES: ${AI_CIRCUIT_BREAKER_FAILURES:-5}
      AI_CIRCUIT_BREAKER_WINDOW_MS: ${AI_CIRCUIT_BREAKER_WINDOW_MS:-300000}
      AI_CIRCUIT_BREAKER_COOLDOWN_MS: ${AI_CIRCUIT_BREAKER_COOLDOWN_MS:-600000}
      AI_INPUT_COST_PER_MILLION_USD: ${AI_INPUT_COST_PER_MILLION_USD:-}
      AI_OUTPUT_COST_PER_MILLION_USD: ${AI_OUTPUT_COST_PER_MILLION_USD:-}
      ESTIMATED_SMS_COST_USD: ${ESTIMATED_SMS_COST_USD:-0.01}
      ESTIMATED_EMAIL_COST_USD: ${ESTIMATED_EMAIL_COST_USD:-0.001}
      ESTIMATED_AI_CALL_COST_USD: ${ESTIMATED_AI_CALL_COST_USD:-0.02}
      ESTIMATED_LEAD_INGESTION_COST_USD: ${ESTIMATED_LEAD_INGESTION_COST_USD:-0}
      OUTBOUND_WEBHOOK_ALLOWED_HOSTS: ${OUTBOUND_WEBHOOK_ALLOWED_HOSTS:-}
      BACKUP_RESTORE_TESTED_AT: ${BACKUP_RESTORE_TESTED_AT:-}
      BACKUP_RPO_MINUTES: ${BACKUP_RPO_MINUTES:-}
      BACKUP_RTO_MINUTES: ${BACKUP_RTO_MINUTES:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-}
      BACKUP_RESTORE_ISOLATED_VERIFIED: ${BACKUP_RESTORE_ISOLATED_VERIFIED:-false}
      BACKUP_RESTORE_CREDENTIALS_PROTECTED: ${BACKUP_RESTORE_CREDENTIALS_PROTECTED:-false}
      LEGAL_DOCUMENTS_REVIEWED_AT: ${LEGAL_DOCUMENTS_REVIEWED_AT:-}
      EXTERNAL_UPTIME_MONITOR_URL: ${EXTERNAL_UPTIME_MONITOR_URL:-}
      CLIENT_DATA_RETENTION_DAYS: ${CLIENT_DATA_RETENTION_DAYS:-30}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_REDIRECT_URL: ${FACEBOOK_REDIRECT_URL:-}
      FACEBOOK_GRAPH_API_VERSION: ${FACEBOOK_GRAPH_API_VERSION:-v19.0}
      FACEBOOK_WEBHOOK_VERIFY_TOKEN: ${FACEBOOK_WEBHOOK_VERIFY_TOKEN:-}
      FACEBOOK_WEBHOOK_URL: ${FACEBOOK_WEBHOOK_URL:-}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_API_URL: http://backend:4000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
